<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учёт посещаемости — IIP</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <img src="logo.png" alt="IIP" class="logo" style="cursor: pointer;" onclick="openAdmin()">
    <div class="header-text">
      <h1>Учёт посещаемости</h1>
      <p>Institute of Innovative Professions</p>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- кнопки входа/выхода рисует JS -->
    </div>
  </div>
</header>

<div class="container">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Поиск группы..." autocomplete="off">
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div id="content">
    <!-- filled by JS -->
  </div>
</div>

<!-- ADMIN / LOGIN MODAL -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Админ-панель</h3>
      <button class="modal-close" onclick="closeAdmin()">×</button>
    </div>
    <div class="modal-body" id="adminBody">
      <!-- login or content -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
