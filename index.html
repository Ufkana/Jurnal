<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учёт посещаемости — IIP</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <img src="logo.png" alt="IIP" class="logo">
      <div class="header-text">
        <h1>Учёт посещаемости</h1>
        <p>Institute of Innovative Professions</p>
      </div>
      <div class="header-actions">
        <button class="btn-icon" onclick="openAdmin()" title="Админ">⚙️</button>
        <button class="btn-icon" onclick="exportData()" title="Экспорт">⬇️</button>
        <button class="btn-icon" onclick="importData()" title="Импорт">⬆️</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- SEARCH -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Поиск группы..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="content">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ Админ-панель</h3>
        <button class="modal-close" onclick="closeAdmin()">×</button>
      </div>
      <div class="modal-body" id="adminBody">
        <!-- login or content -->
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
